name: Android Derleme

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Birim testleri
        run: npm test

      - name: Android projesini oluştur ve web dosyalarını kopyala
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Uygulama simgesi ve açılış ekranı
        run: cp -r resources/android/res/. android/app/src/main/res/

      - name: Sürüm numarası ve dikey ekran ayarı
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=${{ github.run_number }}
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          grep -q 'screenOrientation' android/app/src/main/AndroidManifest.xml || \
            sed -i '0,/<activity/s//<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: APK (debug) ve AAB (release, imzasız) derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Çıktıları adlandır
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/dukkan-ustasi-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/dukkan-ustasi-release-unsigned.aab

      - name: Çıktıları yükle
        uses: actions/upload-artifact@v4
        with:
          name: dukkan-ustasi-android-${{ github.run_number }}
          path: dist/
          retention-days: 14

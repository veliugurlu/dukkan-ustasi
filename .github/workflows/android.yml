name: Android Derleme

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Proje klasörünü bul
        run: |
          CFG=$(find . -name capacitor.config.json -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$CFG" ]; then
            echo "::error::capacitor.config.json bulunamadı. Proje dosyaları depoya yüklenmemiş."
            ls -la
            exit 1
          fi
          PROJ=$(dirname "$CFG")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "Proje klasörü: $PROJ"
          ls -la "$PROJ"

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Bağımlılıkları kur
        working-directory: ${{ env.PROJ }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Birim testleri
        working-directory: ${{ env.PROJ }}
        run: npm test

      - name: Android projesini oluştur ve web dosyalarını kopyala
        working-directory: ${{ env.PROJ }}
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Uygulama simgesi ve açılış ekranı
        working-directory: ${{ env.PROJ }}
        run: |
          if [ -d resources/android/res ]; then cp -r resources/android/res/. android/app/src/main/res/; else echo "Simge klasörü yok, varsayılan simge kullanılacak."; fi

      - name: Sürüm numarası ve dikey ekran ayarı
        working-directory: ${{ env.PROJ }}
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=${{ github.run_number }}
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          grep -q 'screenOrientation' android/app/src/main/AndroidManifest.xml || \
            sed -i '0,/<activity/s//<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          echo "Sürüm: $VERSION_NAME ($VERSION_CODE)"

      - name: APK (debug) ve AAB (release, imzasız) derle
        working-directory: ${{ env.PROJ }}/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Çıktıları adlandır
        working-directory: ${{ env.PROJ }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/dukkan-ustasi-debug.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/dukkan-ustasi-release-unsigned.aab"
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Çıktıları yükle
        uses: actions/upload-artifact@v4
        with:
          name: dukkan-ustasi-android-${{ github.run_number }}
          path: dist/
          retention-days: 14
